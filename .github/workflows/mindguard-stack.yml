name: MindGuard XAI - Full Stack

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  BACKEND_PORT: "8000"
  FRONTEND_PORT: "3000"

jobs:

# ── 1. BACKEND ────────────────────────────────────────────────────────────────
  backend:
    name: Backend (FastAPI + ML)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Syntax check all Python scripts
        run: |
          for f in backend/server.py backend/data_service.py backend/ml_pipeline.py \
                   generate_real_dataset.py data_preprocessing.py \
                   model_training.py model_evaluation.py shap_generation.py; do
            python -m py_compile "$f" && echo "OK $f" || exit 1
          done

      - name: Generate student dataset (CSV — no MySQL needed, ~1s)
        run: |
          mkdir -p backend/data data/processed models plots reports
          python generate_real_dataset.py --n 1200 --seed 42
          echo "CSV: $(wc -l < backend/data/students.csv) rows"

      - name: Check for committed trained model
        id: model_check
        run: |
          if [ -f models/active_model.pkl ] && [ -f models/active_model_metadata.json ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            python -c "
          import json
          m = json.load(open('models/active_model_metadata.json'))
          print('Committed model found — features:', len(m.get('feature_names',[])), '| trained:', m.get('last_trained'))
            "
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "No committed model — will train from scratch"
          fi

      - name: Run preprocessing (only if no committed model)
        if: steps.model_check.outputs.exists == 'false'
        run: python data_preprocessing.py 2>&1 | tail -5

      - name: Train ML model (only if no committed model)
        if: steps.model_check.outputs.exists == 'false'
        run: python model_training.py 2>&1 | tail -5

      - name: Start FastAPI backend
        run: |
          cd backend
          uvicorn server:app \
            --host 0.0.0.0 \
            --port ${{ env.BACKEND_PORT }} \
            --log-level warning > /tmp/uvicorn.log 2>&1 &
          READY=0
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:${{ env.BACKEND_PORT }}/health" > /dev/null 2>&1; then
              echo "Backend ready after ${i}s"; READY=1; break
            fi
            sleep 1
          done
          if [ "$READY" -eq 0 ]; then
            echo "=== Backend failed to start ===" && cat /tmp/uvicorn.log && exit 1
          fi
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'ci-dev-secret-mindguard-2026' }}
          ENVIRONMENT: ci
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"

      - name: API test - GET /health
        run: |
          sleep 3
          r=$(curl -sf "http://localhost:${{ env.BACKEND_PORT }}/health")
          echo "$r" | python -c "
          import sys,json; d=json.load(sys.stdin)
          assert d.get('status') in ('ok','healthy'), f'bad: {d}'
          print('health OK:', d['status'])"

      - name: API test - GET /roles
        run: |
          r=$(curl -sf "http://localhost:${{ env.BACKEND_PORT }}/roles")
          echo "$r" | python -c "
          import sys,json; d=json.load(sys.stdin)
          assert isinstance(d,list) and len(d)>0
          print('roles OK:', len(d), 'roles')"

      - name: API test - POST /login
        run: |
          r=$(curl -sf -X POST "http://localhost:${{ env.BACKEND_PORT }}/login" \
            -H "Content-Type: application/json" \
            -d '{"username":"counsellor1","password":"Care@2026","role":"counsellor"}')
          TOKEN=$(echo "$r" | python -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
          echo "TOKEN=$TOKEN" >> $GITHUB_ENV
          echo "$r" | python -c "
          import sys,json; d=json.load(sys.stdin)
          for f in ['access_token','name','role','roleLabel']:
            assert f in d, f'missing {f}'
          print('login OK: name=%s roleLabel=%s' % (d['name'],d['roleLabel']))"

      - name: API test - GET /students (wait for background ML preload)
        run: |
          echo "Waiting 8s for background ML preload (no SHAP — uses feature_importances_)..."
          sleep 8
          r=$(curl -sf --max-time 30 "http://localhost:${{ env.BACKEND_PORT }}/students" \
            -H "Authorization: Bearer $TOKEN")
          echo "$r" | python -c "
          import sys,json; d=json.load(sys.stdin)
          students = d if isinstance(d,list) else d.get('students',[])
          assert len(students)>0
          s=students[0]
          for f in ['id','name','programme','year','gpa','attendance','risk','tier']:
            assert f in s, f'missing {f}'
          print(f'students OK: {len(students)} students, all fields present')"

      - name: API test - POST /students/batch (route ordering fix)
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "http://localhost:${{ env.BACKEND_PORT }}/students/batch" \
            -H "Authorization: Bearer $TOKEN")
          python -c "
          s=$status
          assert s!=404, f'/students/batch returns 404 — route ordering bug'
          print(f'batch OK: HTTP {s}')"

      - name: API test - GET /stats
        run: |
          r=$(curl -sf "http://localhost:${{ env.BACKEND_PORT }}/stats" \
            -H "Authorization: Bearer $TOKEN")
          echo "$r" | python -c "
          import sys,json; d=json.load(sys.stdin)
          keys=list(d.keys())
          assert 'totalStudents' in d or 'total_students' in d or 'total' in d, f'missing total key: {keys}'
          total=d.get('totalStudents') or d.get('total_students') or d.get('total',0)
          print('/stats OK:', total, 'students')"

      - name: API test - GET /users (admin)
        run: |
          ADMIN_TOKEN=$(curl -sf -X POST "http://localhost:${{ env.BACKEND_PORT }}/login" \
            -H "Content-Type: application/json" \
            -d '{"username":"admin","password":"Admin@2026","role":"admin"}' \
            | python -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
          r=$(curl -sf "http://localhost:${{ env.BACKEND_PORT }}/users" \
            -H "Authorization: Bearer $ADMIN_TOKEN")
          echo "$r" | python -c "
          import sys,json; d=json.load(sys.stdin)
          assert isinstance(d,list) and len(d)>0
          print('users OK:', len(d), 'users')"

      - name: API test - WebSocket /ws
        run: |
          pip install websockets -q
          python - << 'EOF'
          import asyncio, websockets
          async def test():
            async with websockets.connect("ws://localhost:${{ env.BACKEND_PORT }}/ws", open_timeout=5) as ws:
              print("WebSocket OK")
          asyncio.run(test())
          EOF

      - name: Upload backend artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-artifacts
          path: |
            reports/
            models/
            backend/data/
          retention-days: 7


# ── 2. FRONTEND ───────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Lint (ESLint)
        run: cd frontend && npx eslint . --ext .js,.jsx --max-warnings=50 || true

      - name: Build frontend (production)
        run: cd frontend && npm run build
        env:
          VITE_API_URL: http://localhost:${{ env.BACKEND_PORT }}

      - name: Verify build output
        run: |
          test -f frontend/dist/index.html && echo "index.html OK"
          du -sh frontend/dist/

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7


# ── 3. INTEGRATION ────────────────────────────────────────────────────────────
  integration:
    name: Integration (Full Stack)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Download backend artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-artifacts
          path: .

      - name: Set up Python & Node
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          npm install -g serve -q

      - name: Start backend
        run: |
          cd backend
          uvicorn server:app --host 0.0.0.0 --port ${{ env.BACKEND_PORT }} \
            --log-level warning > /tmp/srv.log 2>&1 &
          READY=0
          for i in $(seq 1 60); do
            curl -sf "http://localhost:${{ env.BACKEND_PORT }}/health" && READY=1 && break || sleep 1
          done
          [ "$READY" -eq 0 ] && cat /tmp/srv.log && exit 1 || echo "Backend ready"
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'ci-integration-mindguard-2026' }}
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"

      - name: Start frontend
        run: |
          serve -s frontend/dist -l ${{ env.FRONTEND_PORT }} &
          for i in $(seq 1 20); do
            curl -sf "http://localhost:${{ env.FRONTEND_PORT }}" > /dev/null && break || sleep 1
          done
          echo "Frontend ready"

      - name: Integration - frontend reachable
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:${{ env.FRONTEND_PORT }}")
          test "$status" = "200" && echo "Frontend OK: HTTP $status"

      - name: Integration - CORS headers present
        run: |
          curl -si -X OPTIONS "http://localhost:${{ env.BACKEND_PORT }}/health" \
            -H "Origin: http://localhost:${{ env.FRONTEND_PORT }}" | grep -qi "access-control-allow" \
            && echo "CORS OK" || echo "CORS headers missing"

      - name: Integration - wait for preload then run full flow
        run: |
          echo "Waiting 10s for ML preload (no SHAP deadlock risk)..."
          sleep 10
          python - << 'PYEOF'
          import urllib.request, json
          BASE = "http://localhost:${{ env.BACKEND_PORT }}"
          req = urllib.request.Request(f"{BASE}/login",
            data=json.dumps({"username":"counsellor1","password":"Care@2026","role":"counsellor"}).encode(),
            headers={"Content-Type":"application/json"}, method="POST")
          with urllib.request.urlopen(req, timeout=10) as r:
            login = json.load(r)
          token = login["access_token"]
          assert login.get("name") and login.get("roleLabel"), "Missing login fields"
          print(f"Login OK: {login['name']} ({login['roleLabel']})")
          req = urllib.request.Request(f"{BASE}/students",
            headers={"Authorization": f"Bearer {token}"})
          with urllib.request.urlopen(req, timeout=60) as r:
            students = json.load(r)
          students = students if isinstance(students, list) else students.get("students", [])
          assert len(students) > 0
          for f in ["id","name","programme","year","gpa","attendance","risk","tier"]:
            assert f in students[0], f"Missing: {f}"
          print(f"Students OK: {len(students)} students")
          req = urllib.request.Request(f"{BASE}/stats",
            headers={"Authorization": f"Bearer {token}"})
          with urllib.request.urlopen(req, timeout=10) as r:
            stats = json.load(r)
          assert any(k in stats for k in ["totalStudents","total_students","total"])
          print(f"Stats OK: {stats.get('totalStudents') or stats.get('total','?')} students")
          print("ALL INTEGRATION TESTS PASSED")
          PYEOF

      - name: Integration - all roles login
        run: |
          python - << 'PYEOF'
          import urllib.request, json
          BASE = "http://localhost:${{ env.BACKEND_PORT }}"
          for u,p,r in [("counsellor1","Care@2026","counsellor"),("welfare1","Welfare@2026","welfare"),("admin","Admin@2026","admin")]:
            req = urllib.request.Request(f"{BASE}/login",
              data=json.dumps({"username":u,"password":p,"role":r}).encode(),
              headers={"Content-Type":"application/json"}, method="POST")
            with urllib.request.urlopen(req, timeout=10) as resp:
              d = json.load(resp)
            for field in ["access_token","name","role","roleLabel"]:
              assert field in d, f"{u} missing {field}"
            print(f"  {u}: {d['name']} ({d['roleLabel']})")
          print("ALL ROLES OK")
          PYEOF


# ── 4. SUMMARY ────────────────────────────────────────────────────────────────
  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [backend, frontend, integration]
    if: always()
    timeout-minutes: 2
    steps:
      - name: Results
        run: |
          echo "================================================"
          echo "   MindGuard XAI — CI/CD Summary"
          echo "================================================"
          echo "  Backend     : ${{ needs.backend.result }}"
          echo "  Frontend    : ${{ needs.frontend.result }}"
          echo "  Integration : ${{ needs.integration.result }}"
          echo "  Commit      : ${{ github.sha }}"
          echo "  Branch      : ${{ github.ref_name }}"
          echo "================================================"

      - name: Fail if any job failed
        if: |
          needs.backend.result == 'failure' ||
          needs.frontend.result == 'failure' ||
          needs.integration.result == 'failure'
        run: exit 1
